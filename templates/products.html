{% extends 'base.html' %}
{% block title %}All products — Gadzivo{% endblock %}
{% block content %}<div class="container"><div class="page-title"><h1>All products</h1><p>Find what you love at a better price.</p></div><form class="filters" method="get"><input name="q" value="{{ term }}" placeholder="Search products"><select name="category"><option value="">All categories</option>{% for c in categories %}<option value="{{ c.id }}" {% if selected_category == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select><select name="sort"><option value="newest" {% if sort == 'newest' %}selected{% endif %}>Newest first</option><option value="price_low" {% if sort == 'price_low' %}selected{% endif %}>Price: low to high</option><option value="price_high" {% if sort == 'price_high' %}selected{% endif %}>Price: high to low</option></select><button>Search</button></form><div class="product-grid">{% for p in products %}{% set product=p %}{% include '_card.html' %}{% else %}<p>No products found.</p>{% endfor %}</div></div>{% endblock %}
