{% extends 'base.html' %}
{% block title %}Edit {{ product.name }} — Gadzivo{% endblock %}
{% block content %}<div class="container"><div class="admin-nav edit-nav"><h1>Edit product</h1><a href="{{ url_for('admin_products') }}">← All products</a></div><form method="post" enctype="multipart/form-data" class="form"><label>Name<input name="name" value="{{ product.name }}" required></label><label>Description<textarea name="description" required>{{ product.description }}</textarea></label><div class="form-row"><label>Price<input type="number" name="price" min="0" step="0.01" value="{{ product.price }}" required></label><label>Discount price<input type="number" name="discount_price" min="0" step="0.01" value="{{ product.discount_price or '' }}"></label></div><div class="form-row"><label>Stock<input type="number" name="stock" min="0" value="{{ product.stock }}" required></label><label>Category<select name="category_id">{% for c in categories %}<option value="{{ c.id }}" {% if product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label></div><label>Add more product photos<input type="file" name="images" accept="image/png,image/jpeg,image/gif,image/webp" multiple></label><label>Replace main image with URL (optional)<input type="url" name="image_url"></label><button>Save changes</button></form>{% if images %}<h3>Uploaded photos</h3><div class="edit-images">{% for image in images %}<img src="{{ url_for('uploaded_file',filename=image.image) }}" alt="{{ product.name }} image">{% endfor %}</div>{% endif %}</div>{% endblock %}
